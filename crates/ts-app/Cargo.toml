[package]
name = "ts-app"
description = "ThreadSmith desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "threadsmith"
path = "src/main.rs"

[dependencies]
ts-core.workspace = true
ts-io.workspace = true
ts-fit.workspace = true
ts-library.workspace = true
ts-gen.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
flate2 = "1"
ciborium = "0.2"
tiny_http = "0.12"
ureq = "3"
glam.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui-wgpu = "0.37"
egui = "0.37"

# Puts the icon into threadsmith.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ThreadSmith targets Windows. These lines only let the code build on Linux
# (used for automated checks); they do nothing on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }
