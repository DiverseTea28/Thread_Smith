[package]
name = "ts-core"
description = "Shared types for ThreadSmith: meshes, skeletons, skinning."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_bytes", "glam/serde"]

[dependencies]
glam.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }
